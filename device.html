<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell a Device</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main class="container">
    <div class="box">
      <h2>Device Information</h2>
      <form onsubmit="saveDevice(event)">
        <label for="name">Your Name</label>
        <input type="text" id="name" required>
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" pattern="[6-9][0-9]{9}" maxlength="10" inputmode="numeric" title="Enter a valid 10-digit mobile number" required>
        <label for="brand">Brand</label>
        <select id="brand" required>
          <option value="">Select brand</option>
          <option>Apple</option><option>Samsung</option><option>OnePlus</option><option>Xiaomi</option><option>Other</option>
        </select>
        <label for="model">Model</label>
        <input type="text" id="model" placeholder="e.g. iPhone 13" required>
        <label for="storage">Storage</label>
        <select id="storage" required>
          <option value="">Select storage</option>
          <option value="64">64 GB</option><option value="128">128 GB</option><option value="256">256 GB</option><option value="512">512 GB</option>
        </select>
        <label for="year">Purchase Year</label>
        <input type="number" id="year" min="2015" required>
        <label for="price">Original Price (Rs)</label>
        <input type="number" id="price" min="1" required>
        <button type="submit">Continue</button>
      </form>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script src="js/device.js"></script>
</body>
</html>
