<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Condition</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main class="container">
    <div class="box">
      <h2>Device Condition</h2>
      <p id="summary"></p>
      <form id="form">
        <label class="choice"><input type="radio" name="cond" value="0.70" required><span><b>Excellent</b><br>Like new, no scratches, all features work.</span></label>
        <label class="choice"><input type="radio" name="cond" value="0.55"><span><b>Good</b><br>Light scratches, everything works.</span></label>
        <label class="choice"><input type="radio" name="cond" value="0.35"><span><b>Fair</b><br>Visible wear or dents, small faults.</span></label>
        <label class="choice"><input type="radio" name="cond" value="0.15"><span><b>Poor</b><br>Cracked screen or major faults.</span></label>
        <button type="submit">Get my offer</button>
        <a href="device.html" class="button secondary" style="background:#fff;color:#17324d;border:1px solid #17324d">Back</a>
      </form>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script src="js/condition.js"></script>
</body>
</html>
